<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>引力彈道實驗室 Gravity Lab</title>
<style>
  :root {
    --bg: #03040a;
    --panel: rgba(10, 14, 28, 0.82);
    --panel2: rgba(18, 24, 43, 0.72);
    --line: rgba(140, 190, 255, 0.22);
    --text: #dce9ff;
    --muted: #88a1c7;
    --accent: #7df9ff;
    --accent2: #ffcc66;
    --danger: #ff5c8a;
    --ok: #8cffb1;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    touch-action: none;
    overscroll-behavior: none;
    height: 100%;
    overflow: hidden;
    background: radial-gradient(circle at 50% 50%, #0b1022 0%, #03040a 55%, #010105 100%);
    color: var(--text);
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Noto Sans TC", monospace;
  }

  #game {
    position: fixed;
    touch-action: none;
    inset: 0;
    image-rendering: auto;
    cursor: crosshair;
  }

  .hud {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    top: auto;
    width: 100vw;
    height: 34vh;
    max-height: 34vh;
    overflow: auto;
    padding: 14px 16px 18px;
    border: 1px solid var(--line);
    border-left: none;
    border-right: none;
    border-bottom: none;
    background: linear-gradient(180deg, rgba(8,12,26,.96), rgba(6,8,18,.90));
    backdrop-filter: blur(14px);
    box-shadow: 0 -10px 36px rgba(0, 180, 255, .16), inset 0 0 18px rgba(125,249,255,.035);
    border-radius: 18px 18px 0 0;
    z-index: 7;
    transform: translateY(100%);
    transition: transform .22s ease;
  }

  .hud.open {
    transform: translateY(0);
  }

  .hud-grid {
    display: grid;
    grid-template-columns: 290px repeat(4, minmax(280px, 1fr));
    gap: 10px;
    align-items: start;
  }

  .panel-toggle {
    position: fixed;
    right: 16px;
    bottom: 16px;
    z-index: 9;
    min-width: 142px;
    border-color: rgba(125,249,255,.75);
    color: white;
    background: linear-gradient(180deg, rgba(0,150,210,.72), rgba(20,60,110,.72));
    box-shadow: 0 0 22px rgba(125,249,255,.25);
  }

  .panel-toggle.panel-open {
    bottom: calc(34vh + 14px);
  }

  .hud::-webkit-scrollbar { width: 8px; }
  .hud::-webkit-scrollbar-thumb { background: rgba(125,249,255,.28); border-radius: 10px; }

  h1 {
    margin: 0 0 4px;
    font-size: 18px;
    letter-spacing: .08em;
    color: var(--accent);
    text-shadow: 0 0 14px rgba(125,249,255,.7);
  }

  .subtitle {
    color: var(--muted);
    font-size: 12px;
    line-height: 1.45;
    margin-bottom: 12px;
  }

  .section {
    border: 1px solid rgba(140,190,255,.14);
    background: var(--panel2);
    border-radius: 12px;
    padding: 10px;
    margin-top: 10px;
  }

  .section-title {
    color: #fff;
    font-size: 12px;
    margin-bottom: 9px;
    letter-spacing: .08em;
  }

  label {
    display: grid;
    grid-template-columns: 94px 1fr 86px;
    gap: 8px;
    align-items: center;
    font-size: 12px;
    color: #b9cbeb;
    margin: 8px 0;
  }

  input[type="range"] {
    width: 100%;
    min-height: 28px;
    accent-color: var(--accent);
  }

  .range-number {
    width: 86px;
    min-width: 0;
    padding: 7px 6px;
    text-align: right;
    color: var(--text);
    background: rgba(5, 8, 18, .92);
    border: 1px solid rgba(125,249,255,.28);
    border-radius: 9px;
    font: inherit;
    font-size: 11px;
  }
select, button, input[type="number"] {
    color: var(--text);
    background: rgba(5, 8, 18, .92);
    border: 1px solid rgba(125,249,255,.28);
    border-radius: 9px;
    padding: 8px 10px;
    font: inherit;
    outline: none;
  }

  button {
    cursor: pointer;
    min-height: 42px;
    touch-action: manipulation;
    transition: transform .08s ease, border-color .2s, box-shadow .2s, background .2s;
  }

  button:hover {
    border-color: rgba(125,249,255,.75);
    box-shadow: 0 0 16px rgba(125,249,255,.18);
    background: rgba(15, 30, 50, .92);
  }

  button:active { transform: translateY(1px) scale(.99); }

  button.active-mode {
    border-color: rgba(255,204,102,.9);
    box-shadow: 0 0 18px rgba(255,204,102,.25), inset 0 0 14px rgba(255,204,102,.08);
    color: #fff2c7;
  }

  button.orbit-active {
    border-color: rgba(140,255,177,.9);
    color: #e8fff0;
    box-shadow: 0 0 18px rgba(140,255,177,.25), inset 0 0 14px rgba(140,255,177,.08);
  }

  .color-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 8px;
  }

  .color-picker {
    display: grid;
    grid-template-columns: 72px 1fr;
    gap: 8px;
    align-items: center;
    font-size: 12px;
    color: #b9cbeb;
  }

  input[type="color"] {
    width: 100%;
    height: 38px;
    border: 1px solid rgba(125,249,255,.28);
    border-radius: 9px;
    background: rgba(5,8,18,.92);
    padding: 3px;
  }

  .row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 8px;
  }

  .wide {
    width: 100%;
    margin-top: 8px;
  }

  .primary {
    background: linear-gradient(180deg, rgba(0, 150, 210, .45), rgba(20, 60, 110, .45));
    color: white;
    border-color: rgba(125,249,255,.72);
  }

  .danger { border-color: rgba(255, 92, 138, .55); color: #ffd7e2; }
  .ok { border-color: rgba(140,255,177,.55); color: #ddffe9; }

  .hint {
    margin-top: 10px;
    color: var(--muted);
    font-size: 11px;
    line-height: 1.55;
  }

  .placement-banner {
    position: fixed;
    left: 50%;
    top: 16px;
    transform: translateX(-50%);
    z-index: 8;
    display: none;
    max-width: min(620px, calc(100vw - 28px));
    padding: 11px 15px;
    border-radius: 999px;
    border: 1px solid rgba(125,249,255,.35);
    background: rgba(4, 8, 20, .78);
    color: #eaf5ff;
    backdrop-filter: blur(10px);
    box-shadow: 0 0 24px rgba(125,249,255,.16);
    font-size: 13px;
    pointer-events: none;
    text-align: center;
  }

  .placement-banner strong {
    color: var(--accent);
    text-shadow: 0 0 10px rgba(125,249,255,.7);
  }

  .placement-banner.show {
    display: block;
  }

  .status {
    position: fixed;
    left: 14px;
    top: 14px;
    right: 14px;
    min-height: 42px;
    pointer-events: none;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: start;
  }

  .chip {
    background: rgba(8, 12, 25, .72);
    border: 1px solid rgba(125,249,255,.18);
    color: #bdd7ff;
    border-radius: 999px;
    padding: 8px 11px;
    font-size: 12px;
    backdrop-filter: blur(8px);
    box-shadow: 0 0 20px rgba(0,0,0,.25);
  }

  .chip strong { color: white; }

  .help {
    position: fixed;
    right: 14px;
    bottom: 14px;
    width: min(430px, calc(100vw - 28px));
    color: #a8bad8;
    background: rgba(7, 9, 18, .70);
    border: 1px solid rgba(140,190,255,.15);
    border-radius: 14px;
    padding: 12px;
    font-size: 12px;
    line-height: 1.55;
    backdrop-filter: blur(10px);
  }

  .kbd {
    color: #fff;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.12);
    padding: 1px 6px;
    border-radius: 6px;
  }

@media (max-width: 760px) {
    .hud {
      height: 38vh;
      max-height: 38vh;
      padding: 12px;
    }

    .hud-grid {
      grid-template-columns: 1fr;
    }

    .panel-toggle.panel-open {
      bottom: calc(38vh + 12px);
    }

    .status {
      left: 10px;
      right: 10px;
      top: 10px;
    }

    .placement-banner {
      top: 58px;
      border-radius: 14px;
      line-height: 1.35;
    }

    .help { display: none; }
    label { grid-template-columns: 82px 1fr 48px; }
    .section { padding: 9px; }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<aside class="hud" id="controlPanel">
  <h1>GRAVITY LAB</h1>
  <div class="subtitle">引力彈道實驗室：放置引力球，調整發射台，讓小球被捕獲、繞行、彈弓甩出，或直接撞成太空煙火。</div>

  <div class="hud-grid">
  <div class="section">
    <div class="section-title">發射台</div>
    <label>力度 <input id="power" type="range" min="20" max="900" value="340" step="1"><input class="range-number" id="powerNum" type="number"></label>
    <label>角度 <input id="angle" type="range" min="0" max="360" value="28" step="1"><input class="range-number" id="angleNum" type="number"></label>
    <label>小球半徑 <input id="probeRadius" type="range" min="2" max="10" value="4" step="1"><input class="range-number" id="probeRadiusNum" type="number"></label>
    <div class="row">
      <button class="primary" id="launchBtn">發射小球</button>
      <button id="setLauncherBtn">設定發射台</button>
    </div>
    <button class="wide" id="clearProbesBtn">清除小球</button>
  </div>

  <div class="section">
    <div class="section-title">環境</div>
    <label>空氣阻力 <input id="drag" type="range" min="0" max="0.30" value="0.000" step="0.001"><input class="range-number" id="dragNum" type="number"></label>
    <label>時間倍率 <input id="timeScale" type="range" min="0.15" max="4" value="1" step="0.05"><input class="range-number" id="timeScaleNum" type="number"></label>
    <label>軌跡長度 <input id="trail" type="range" min="20" max="1600" value="520" step="10"><input class="range-number" id="trailNum" type="number"></label>
    <div class="row">
      <button id="pauseBtn">暫停</button>
      <button id="resetViewBtn">視角歸零</button>
    </div>
    <button class="wide" id="orbitModeBtn">軌道模式：關</button>
  </div>

  <div class="section">
    <div class="section-title">新增引力球</div>
    <select id="preset" class="wide">
      <optgroup label="特殊天體">
        <option value="blackhole">黑洞</option>
        <option value="whitehole">白洞</option>
        <option value="neutronstar">中子星</option>
        <option value="stephenson218">史蒂文森 2-18</option>
        <option value="uyscuti">盾牌座 UY</option>
        <option value="siriusa">天狼星 A</option>
        <option value="proxima">比鄰星</option>
        <option value="arcturus">大角星</option>
        <option value="canopus">老人星</option>
        <option value="sun">太陽</option>
      </optgroup>
      <optgroup label="八大行星">
        <option value="mercury">水星</option>
        <option value="venus">金星</option>
        <option value="earth">地球</option>
        <option value="mars">火星</option>
        <option value="jupiter">木星</option>
        <option value="saturn">土星</option>
        <option value="uranus">天王星</option>
        <option value="neptune">海王星</option>
      </optgroup>
      <optgroup label="矮行星 / 大型外海王星天體">
        <option value="ceres">穀神星</option>
        <option value="pluto">冥王星</option>
        <option value="haumea">妊神星</option>
        <option value="makemake">鳥神星</option>
        <option value="eris">鬩神星</option>
        <option value="orcus">亡神星</option>
      </optgroup>
      <optgroup label="主要衛星">
        <option value="moon">月球</option>
        <option value="phobos">火衛一 Phobos</option>
        <option value="deimos">火衛二 Deimos</option>
        <option value="io">木衛一 Io</option>
        <option value="europa">木衛二 Europa</option>
        <option value="ganymede">木衛三 Ganymede</option>
        <option value="callisto">木衛四 Callisto</option>
        <option value="mimas">土衛一 Mimas</option>
        <option value="enceladus">土衛二 Enceladus</option>
        <option value="tethys">土衛三 Tethys</option>
        <option value="dione">土衛四 Dione</option>
        <option value="rhea">土衛五 Rhea</option>
        <option value="titan">土衛六 Titan</option>
        <option value="iapetus">土衛八 Iapetus</option>
        <option value="phoebe">土衛九 Phoebe</option>
        <option value="miranda">天衛五 Miranda</option>
        <option value="ariel">天衛一 Ariel</option>
        <option value="umbriel">天衛二 Umbriel</option>
        <option value="titania">天衛三 Titania</option>
        <option value="oberon">天衛四 Oberon</option>
        <option value="triton">海衛一 Triton</option>
        <option value="nereid">海衛二 Nereid</option>
        <option value="proteus">Proteus</option>
        <option value="charon">冥衛一 Charon</option>
        <option value="nix">冥衛二 Nix</option>
        <option value="hydra">冥衛三 Hydra</option>
        <option value="kerberos">冥衛四 Kerberos</option>
        <option value="styx">冥衛五 Styx</option>
        <option value="namaka">妊衛一 Namaka</option>
        <option value="hiiaka">妊衛二 Hiʻiaka</option>
        <option value="mk2">鳥神星衛星 MK2</option>
        <option value="dysnomia">鬩衛一 Dysnomia</option>
        <option value="vanth">亡衛一 Vanth</option>
      </optgroup>
      <option value="custom">自訂</option>
    </select>
    <label>大小 <input id="planetRadius" type="range" min="10" max="90" value="34" step="1"><input class="range-number" id="planetRadiusNum" type="number"></label>
    <label>質量 <input id="planetMass" type="range" min="-100000000" max="100000000" value="9000" step="10000"><input class="range-number" id="planetMassNum" type="number"></label>
    <label>大氣厚度 <input id="atmosphere" type="range" min="0" max="160" value="30" step="1"><input class="range-number" id="atmosphereNum" type="number"></label>
    <div class="color-row">
      <div class="color-picker">主顏色 <input id="primaryColor" type="color" value="#a46bff"></div>
      <div class="color-picker">副顏色 <input id="secondaryColor" type="color" value="#7df9ff"></div>
    </div>

    <div class="row">
      <button class="ok" id="placePlanetBtn">放置引力球</button>
      <button class="danger" id="deletePlanetBtn">刪除選中</button>
    </div>
  </div>

  <div class="section">
      <div class="section-title">管理 / 自訂</div>
      <button class="wide danger" id="clearAllBtn">清空全部</button>
  </div>

  <div class="hint">
    操作：滑鼠滾輪縮放，中鍵/右鍵拖曳視角；觸控支援單指拖曳、雙指縮放與平移。<br>
    選「設定發射台」或「放置引力球」後，在畫布點一下。<br>
    點引力球可選中，拖曳可移動。選中後滑桿會同步修改它的大小、質量與大氣。
  </div>
</div>
</aside>

<button class="panel-toggle" id="panelToggle">控制面板 ▲</button>

<div class="placement-banner" id="placementBanner"></div>
<div class="status" id="status"></div>

<div class="help">
  <b>玩法小提醒</b><br>
  <span class="kbd">手機</span> 單指拖曳星球/平移視角，雙指縮放。<span class="kbd">空阻 = 0</span> 幾乎就是太空；速度剛好會成為衛星，太慢會撞上去，太快會逃逸。<br>
  大氣厚度會額外拖慢穿過大氣的小球，做得太厚會像宇宙果凍，超好笑但很不科學。
</div>

<script>
(() => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d", { alpha: false });

  // 兼容手機瀏覽器、file:// 本機開啟、舊版 WebView。
  function safeId() {
    try {
      if (globalThis.crypto && typeof globalThis.crypto.randomUUID === "function") {
        return globalThis.crypto.randomUUID();
      }
    } catch (_) {}
    return "id_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2);
  }

  if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
      if (w < 2 * r) r = w / 2;
      if (h < 2 * r) r = h / 2;
      this.beginPath();
      this.moveTo(x + r, y);
      this.arcTo(x + w, y, x + w, y + h, r);
      this.arcTo(x + w, y + h, x, y + h, r);
      this.arcTo(x, y + h, x, y, r);
      this.arcTo(x, y, x + r, y, r);
      this.closePath();
      return this;
    };
  }

  const $ = id => document.getElementById(id);
  const ui = {
    power: $("power"), angle: $("angle"), probeRadius: $("probeRadius"),
    drag: $("drag"), timeScale: $("timeScale"), trail: $("trail"),
    preset: $("preset"), planetRadius: $("planetRadius"), planetMass: $("planetMass"), atmosphere: $("atmosphere"),
    primaryColor: $("primaryColor"), secondaryColor: $("secondaryColor"),
    powerNum: $("powerNum"), angleNum: $("angleNum"), probeRadiusNum: $("probeRadiusNum"),
    dragNum: $("dragNum"), timeScaleNum: $("timeScaleNum"), trailNum: $("trailNum"),
    planetRadiusNum: $("planetRadiusNum"), planetMassNum: $("planetMassNum"), atmosphereNum: $("atmosphereNum"),
    launchBtn: $("launchBtn"), setLauncherBtn: $("setLauncherBtn"), clearProbesBtn: $("clearProbesBtn"),
    pauseBtn: $("pauseBtn"), resetViewBtn: $("resetViewBtn"), orbitModeBtn: $("orbitModeBtn"),
    placePlanetBtn: $("placePlanetBtn"), deletePlanetBtn: $("deletePlanetBtn"),
    clearAllBtn: $("clearAllBtn"),
    status: $("status"),
    placementBanner: $("placementBanner"),
    controlPanel: $("controlPanel"),
    panelToggle: $("panelToggle")
  };

  let W = 0, H = 0, DPR = 1;
  let camera = { x: 0, y: 0, zoom: 1 };
  let mode = "none";
  let paused = false;
  let orbitAssistMode = false;
  let selectedPlanet = null;
  let draggingPlanet = null;
  let panning = false;
  let lastMouse = { x: 0, y: 0 };
  let mouse = { x: 0, y: 0, wx: 0, wy: 0 };
  const touchState = {
    active: false,
    mode: "none",
    lastX: 0,
    lastY: 0,
    lastDist: 0,
    lastCenter: { x: 0, y: 0 },
    moved: false,
    startTime: 0
  };

  const pointerState = {
    usingPointer: !!window.PointerEvent,
    pointers: new Map(),
    mode: "none",
    lastCenter: { x: 0, y: 0 },
    lastDist: 0
  };

  const G = 1.35; // 整體引力提升 2 倍
  const SOFTENING = 45;
  const MAX_SPEED = 18000;
  const COLLISION_BOUNCE = 0.15;

  const launcher = { x: -330, y: 120 };
  const probes = [];
  const planets = [];
  const particles = [];

  const presets={
    blackhole:{name:"黑洞",radius:38,mass:95000000,atmosphere:0,colors:["#000000","#181023"],glow:"#b06cff",rings:true,ringCount:2,ringWidth:4,ringColor:"#ffb45a",blackHole:true},
    whitehole:{name:"白洞",radius:38,mass:-95000000,atmosphere:0,colors:["#f8fbff","#ffffff"],glow:"#dff8ff",rings:true,ringCount:3,ringWidth:3,ringColor:"#e8fbff",whiteHole:true},
    neutronstar:{name:"中子星",radius:22,mass:92000000,atmosphere:8,colors:["#9feaff","#ffffff"],glow:"#bff6ff",rings:false,ringCount:1,ringWidth:3,ringColor:"#e8fbff"},
    stephenson218:{name:"史蒂文森 2-18",radius:124,mass:90000000,atmosphere:165,colors:["#b83220","#ffd08a"],glow:"#ff8c4d",rings:false,ringCount:1,ringWidth:3,ringColor:"#ffb06b"},
    uyscuti:{name:"盾牌座 UY",radius:118,mass:88000000,atmosphere:158,colors:["#9f261b","#ffbc73"],glow:"#ff7d45",rings:false,ringCount:1,ringWidth:3,ringColor:"#ff9a58"},
    canopus:{name:"老人星",radius:94,mass:72000000,atmosphere:130,colors:["#ffe2a5","#ffffff"],glow:"#ffe7b8",rings:false,ringCount:1,ringWidth:3,ringColor:"#ffe7b8"},
    arcturus:{name:"大角星",radius:86,mass:48000000,atmosphere:115,colors:["#d36b24","#ffd18c"],glow:"#ff9f54",rings:false,ringCount:1,ringWidth:3,ringColor:"#ffb36c"},
    siriusa:{name:"天狼星 A",radius:54,mass:42000000,atmosphere:48,colors:["#c8e6ff","#ffffff"],glow:"#d8f0ff",rings:false,ringCount:1,ringWidth:3,ringColor:"#e6f6ff"},
    sun:{name:"太陽",radius:70,mass:35000000,atmosphere:115,colors:["#ff7c1a","#fff06e"],glow:"#ffcf4d",rings:false,ringCount:1,ringWidth:3,ringColor:"#ffcf4d"},

  function resize() {
    DPR = Math.max(1, Math.min(2, devicePixelRatio || 1));
    W = innerWidth;
    H = innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  resize();

  function worldToScreen(x, y) {
    return { x: (x - camera.x) * camera.zoom + W / 2, y: (y - camera.y) * camera.zoom + H / 2 };
  }

  function screenToWorld(x, y) {
    return { x: (x - W / 2) / camera.zoom + camera.x, y: (y - H / 2) / camera.zoom + camera.y };
  }

  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function len(x, y) { return Math.hypot(x, y); }

  function syncLabels() {
    ui.powerNum.value = Math.round(+ui.power.value);
    ui.angleNum.value = Math.round(+ui.angle.value);
    ui.probeRadiusNum.value = +ui.probeRadius.value;
    ui.dragNum.value = (+ui.drag.value).toFixed(3);
    ui.timeScaleNum.value = (+ui.timeScale.value).toFixed(2);
    ui.trailNum.value = +ui.trail.value;
    ui.planetRadiusNum.value = +ui.planetRadius.value;
    ui.planetMassNum.value = Math.round(+ui.planetMass.value);
    ui.atmosphereNum.value = +ui.atmosphere.value;
  }


  function setPlanetControls(p) {
    ui.planetRadius.value = p.radius;
    ui.planetMass.value = p.mass;
    ui.atmosphere.value = p.atmosphere;
    if (p.colors) {
      ui.primaryColor.value = p.colors[0];
      ui.secondaryColor.value = p.colors[1];
    }
    syncLabels();
  }

  function applyPresetToSliders() {
    const p = presets[ui.preset.value] || presets.custom;
    ui.planetRadius.value = p.radius;
    ui.planetMass.value = p.mass;
    ui.atmosphere.value = p.atmosphere;
    ui.primaryColor.value = p.colors[0];
    ui.secondaryColor.value = p.colors[1];
    syncLabels();
  }


  function setMode(nextMode) {
    if (nextMode === "none") {
      mode = "none";
    } else {
      mode = mode === nextMode ? "none" : nextMode;
    }

    draggingPlanet = null;

    ui.setLauncherBtn.classList.toggle("active-mode", mode === "setLauncher");
    ui.placePlanetBtn.classList.toggle("active-mode", mode === "placePlanet");

    if (mode === "setLauncher") {
      ui.setLauncherBtn.textContent = "點宇宙放置中...";
      ui.placePlanetBtn.textContent = "放置引力球";
      showPlacementBanner("發射台放置模式：請點擊黑色大空間任意位置放置。再按一次可取消。");
    } else if (mode === "placePlanet") {
      ui.placePlanetBtn.textContent = "點宇宙放置中...";
      ui.setLauncherBtn.textContent = "設定發射台";
      showPlacementBanner("引力球放置模式：請點擊黑色大空間任意位置新增。再按一次可取消。");
    } else {
      ui.setLauncherBtn.textContent = "設定發射台";
      ui.placePlanetBtn.textContent = "放置引力球";
      hidePlacementBanner();
    }
  }

  function showPlacementBanner(text) {
    ui.placementBanner.innerHTML = `<strong>等待放置</strong>　${text}`;
    ui.placementBanner.classList.add("show");
  }

  function hidePlacementBanner() {
    ui.placementBanner.classList.remove("show");
  }

  function finishPlacement() {
    mode = "none";
    setMode("none");
  }

  function makePlanet(x, y, presetKey = ui.preset.value) {
    const base = presets[presetKey] || presets.custom;
    const isCustom = presetKey === "custom";
    const colors = isCustom
      ? [ui.primaryColor.value, ui.secondaryColor.value]
      : [base.colors[0], base.colors[1]];

    const p = {
      id: safeId(),
      x, y,
      radius: +ui.planetRadius.value,
      mass: +ui.planetMass.value,
      atmosphere: +ui.atmosphere.value,
      name: base.name,
      colors,
      glow: isCustom ? ui.secondaryColor.value : base.glow,
      spin: Math.random() * Math.PI * 2,
      rings: !!base.rings,
      ringCount: base.ringCount || 1,
      ringWidth: base.ringWidth || 3,
      ringColor: base.ringColor || base.glow || "#ffe0a2",
      blackHole: !!base.blackHole,
      whiteHole: !!base.whiteHole
    };
    planets.push(p);
    selectedPlanet = p;
    setPlanetControls(p);
    return p;
  }


  function launchProbe() {
    const angle = (+ui.angle.value) * Math.PI / 180;
    const power = +ui.power.value;
    const r = +ui.probeRadius.value;
    const p = {
      x: launcher.x,
      y: launcher.y,
      vx: Math.cos(angle) * power,
      vy: Math.sin(angle) * power,
      radius: r,
      trail: [],
      age: 0,
      alive: true,
      periapsis: {},
      orbitMemory: {},
      colorSeed: Math.random()
    };
    probes.push(p);
  }

  function explode(x, y, color = "#7df9ff", count = 34) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 40 + Math.random() * 320;
      particles.push({
        x, y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s,
        life: 0.35 + Math.random() * 0.9,
        max: 0.7 + Math.random() * 0.8,
        color,
        size: 1 + Math.random() * 3
      });
    }
  }


  function predictOrbitRisk(probe, pl, d) {
    // Invisible predictor: looks at current specific orbital energy and angular momentum.
    // It does not draw anything; it only returns whether we are likely to crash, escape, or stay eccentric.
    if (!orbitAssistMode || pl.blackHole || pl.whiteHole || pl.mass <= 0 || d <= 0) {
      return { target: null, risk: "none", blend: 0 };
    }

    const dx = probe.x - pl.x;
    const dy = probe.y - pl.y;
    const vx = probe.vx;
    const vy = probe.vy;
    const mu = G * Math.abs(pl.mass);

    const r = Math.max(1, d);
    const speed2 = vx * vx + vy * vy;
    const energy = speed2 / 2 - mu / r;
    const h = dx * vy - dy * vx;

    let risk = "elliptic";
    let blend = 0.018;

    if (energy >= 0) {
      risk = "escape";
      blend = 0.055;
    } else {
      const a = -mu / (2 * energy);
      const e2 = clamp(1 - (h * h) / (mu * Math.max(1, a)), 0, 0.999);
      const ecc = Math.sqrt(e2);
      const periapsis = a * (1 - ecc);

      if (periapsis < pl.radius + probe.radius + 22) {
        risk = "crash";
        blend = 0.07;
      } else if (ecc > 0.45) {
        risk = "eccentric";
        blend = 0.04;
      } else {
        risk = "soft";
        blend = 0.018;
      }
    }

    const assistRange = pl.radius + Math.max(260, pl.atmosphere + 240);
    if (d > assistRange) {
      blend *= 0.15;
    }

    const rx = dx / r;
    const ry = dy / r;

    let tx = -ry;
    let ty = rx;

    const tangentialSign = vx * tx + vy * ty;
    if (tangentialSign < 0) {
      tx *= -1;
      ty *= -1;
    }

    // Circle slightly outside current altitude, so the assist does not slam the probe into the surface.
    const targetRadius = Math.max(r, pl.radius + probe.radius + 45);
    const circularSpeed = Math.sqrt(mu / targetRadius);

    return {
      risk,
      blend,
      target: {
        vx: tx * circularSpeed,
        vy: ty * circularSpeed
      }
    };
  }

  function applyOrbitAssist(probe, pl, d) {
    if (!orbitAssistMode || !probe.alive || pl.blackHole || pl.whiteHole || pl.mass <= 0) return;

    const plan = predictOrbitRisk(probe, pl, d);
    if (!plan.target) return;

    const key = pl.id;
    if (!probe.orbitMemory[key]) {
      probe.orbitMemory[key] = { pulse: 0 };
    }

    const mem = probe.orbitMemory[key];
    const localRange = pl.radius + Math.max(340, pl.atmosphere + 260);
    const proximity = clamp(1 - (d - pl.radius) / Math.max(1, localRange - pl.radius), 0, 1);

    // Slow, continuous autopilot. Stronger near the body or if predicted to crash/escape.
    let blend = plan.blend * (0.2 + proximity * 1.8);
    blend = clamp(blend, 0, 0.11);

    probe.vx += (plan.target.vx - probe.vx) * blend;
    probe.vy += (plan.target.vy - probe.vy) * blend;

    mem.pulse += blend;
    if (mem.pulse > 0.45) {
      mem.pulse = 0;
      explode(probe.x, probe.y, "#8cffb1", 10);
    }
  }

  function updateProbe(probe, dt) {
    let ax = 0, ay = 0;

    for (const pl of planets) {
      const dx = pl.x - probe.x;
      const dy = pl.y - probe.y;
      const rawD2 = dx * dx + dy * dy;
      const d = Math.sqrt(rawD2) || 0.0001;

      const soft = Math.max(SOFTENING, pl.radius * pl.radius * 0.12);
      const d2 = rawD2 + soft;
      const force = G * pl.mass / d2;

      ax += (dx / d) * force;
      ay += (dy / d) * force;

      if (pl.whiteHole) {
        // White hole burst: negative gravity already repels; this is the "super blow away" core.
        const burstRange = pl.radius * 8 + 260;
        if (d < burstRange) {
          const burst = (1 - d / burstRange);
          const kick = 4200 * burst * burst * dt;
          probe.vx -= (dx / d) * kick;
          probe.vy -= (dy / d) * kick;
          if (Math.random() < 0.06) explode(probe.x, probe.y, "#e8fbff", 8);
        }
      }

      applyOrbitAssist(probe, pl, d);

      const atmosphereEdge = pl.radius + pl.atmosphere;
      if (pl.atmosphere > 0 && d < atmosphereEdge) {
        const depth = 1 - clamp((d - pl.radius) / Math.max(1, pl.atmosphere), 0, 1);
        const localDrag = depth * depth * 1.25;
        probe.vx *= Math.max(0, 1 - localDrag * dt);
        probe.vy *= Math.max(0, 1 - localDrag * dt);
      }

      const hitRadius = pl.blackHole ? pl.radius * 1.08 : pl.whiteHole ? 0 : pl.radius + probe.radius;
      if (hitRadius > 0 && d < hitRadius) {
        explode(probe.x, probe.y, pl.glow || "#7df9ff", pl.blackHole ? 80 : 50);
        probe.alive = false;
        return;
      }
    }

    const globalDrag = +ui.drag.value;
    if (globalDrag > 0) {
      const dragFactor = Math.max(0, 1 - globalDrag * dt * 1.7);
      probe.vx *= dragFactor;
      probe.vy *= dragFactor;
    }

    probe.vx += ax * dt;
    probe.vy += ay * dt;

    const speed = len(probe.vx, probe.vy);
    if (speed > MAX_SPEED) {
      probe.vx = probe.vx / speed * MAX_SPEED;
      probe.vy = probe.vy / speed * MAX_SPEED;
    }

    probe.x += probe.vx * dt;
    probe.y += probe.vy * dt;
    probe.age += dt;

    probe.trail.push({ x: probe.x, y: probe.y });
    const maxTrail = +ui.trail.value;
    if (probe.trail.length > maxTrail) probe.trail.splice(0, probe.trail.length - maxTrail);

    if (Math.abs(probe.x - camera.x) > 32000 || Math.abs(probe.y - camera.y) > 32000) {
      probe.alive = false;
    }
  }

  function updateParticles(dt) {
    for (const p of particles) {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= 1 - 0.8 * dt;
      p.vy *= 1 - 0.8 * dt;
      p.life -= dt;
    }
    for (let i = particles.length - 1; i >= 0; i--) {
      if (particles[i].life <= 0) particles.splice(i, 1);
    }
  }

  function starField() {
    ctx.fillStyle = "#03040a";
    ctx.fillRect(0, 0, W, H);

    const grid = 190 * camera.zoom;
    const baseX = ((-camera.x * camera.zoom) % grid + grid) % grid;
    const baseY = ((-camera.y * camera.zoom) % grid + grid) % grid;

    ctx.save();
    ctx.globalAlpha = .16;
    ctx.strokeStyle = "#3d5f95";
    ctx.lineWidth = 1;
    for (let x = baseX; x < W; x += grid) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let y = baseY; y < H; y += grid) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
    ctx.restore();

    const t = performance.now() * 0.00008;
    for (let layer = 0; layer < 3; layer++) {
      const spacing = [68, 113, 181][layer];
      const alpha = [.24, .16, .11][layer];
      const size = [1.15, 1.6, 2.1][layer];
      const par = [0.16, 0.08, 0.035][layer];
      const ox = ((-camera.x * camera.zoom * par) % spacing + spacing) % spacing;
      const oy = ((-camera.y * camera.zoom * par) % spacing + spacing) % spacing;
      ctx.fillStyle = `rgba(190,220,255,${alpha})`;
      for (let x = ox; x < W + spacing; x += spacing) {
        for (let y = oy; y < H + spacing; y += spacing) {
          const n = Math.sin((x * 12.9898 + y * 78.233) * 0.013 + layer * 11.7);
          if (n > 0.37) {
            const twinkle = 0.65 + 0.35 * Math.sin(t * 40 + x * .01 + y * .02);
            ctx.globalAlpha = alpha * twinkle;
            ctx.fillRect(Math.round(x), Math.round(y), size, size);
          }
        }
      }
      ctx.globalAlpha = 1;
    }
  }

  function drawAtmosphere(pl) {
    if (pl.atmosphere <= 0) return;
    const s = worldToScreen(pl.x, pl.y);
    const r = pl.radius * camera.zoom;
    const a = (pl.radius + pl.atmosphere) * camera.zoom;
    const g = ctx.createRadialGradient(s.x, s.y, r, s.x, s.y, a);
    g.addColorStop(0, "rgba(125,249,255,0.00)");
    g.addColorStop(.55, "rgba(125,249,255,0.055)");
    g.addColorStop(1, "rgba(125,249,255,0.18)");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(s.x, s.y, a, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "rgba(125,249,255,0.18)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(s.x, s.y, a, 0, Math.PI * 2);
    ctx.stroke();
  }

  function drawPlanet(pl) {
    const s = worldToScreen(pl.x, pl.y);
    const r = pl.radius * camera.zoom;
    if (r < 1) return;

    if (pl.blackHole) {
      ctx.save();
      const halo = ctx.createRadialGradient(s.x, s.y, r * 0.2, s.x, s.y, r * 4.2);
      halo.addColorStop(0, "rgba(255,255,255,0.88)");
      halo.addColorStop(0.08, "rgba(176,108,255,0.55)");
      halo.addColorStop(0.28, "rgba(255,140,60,0.20)");
      halo.addColorStop(1, "rgba(176,108,255,0)");
      ctx.fillStyle = halo;
      ctx.beginPath();
      ctx.arc(s.x, s.y, r * 4.2, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "rgba(255,180,90,.65)";
      ctx.lineWidth = Math.max(2, 4 * camera.zoom);
      ctx.beginPath();
      ctx.ellipse(s.x, s.y, r * 2.2, r * 0.55, -0.28 + pl.spin, 0, Math.PI * 2);
      ctx.stroke();

      ctx.shadowBlur = 26;
      ctx.shadowColor = "#b06cff";
      ctx.fillStyle = "#000";
      ctx.beginPath();
      ctx.arc(s.x, s.y, r, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "rgba(210,180,255,.88)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(s.x, s.y, r + 4, 0, Math.PI * 2);
      ctx.stroke();

      if (selectedPlanet === pl) {
        ctx.setLineDash([6, 6]);
        ctx.strokeStyle = "#7df9ff";
        ctx.beginPath();
        ctx.arc(s.x, s.y, r + 13, 0, Math.PI * 2);
        ctx.stroke();
      }

      ctx.fillStyle = "rgba(235,225,255,.86)";
      ctx.font = "11px ui-monospace, monospace";
      ctx.fillText(`${pl.name} M:${Math.round(pl.mass)}`, s.x + r + 11, s.y - r - 8);
      ctx.restore();
      return;
    }

    drawAtmosphere(pl);

    ctx.save();
    ctx.shadowBlur = 28 * camera.zoom;
    ctx.shadowColor = pl.glow;
    const grad = ctx.createRadialGradient(s.x - r * .32, s.y - r * .38, r * .12, s.x, s.y, r * 1.25);
    grad.addColorStop(0, "#ffffff");
    grad.addColorStop(.12, pl.colors[1]);
    grad.addColorStop(.58, pl.colors[0]);
    grad.addColorStop(1, "#050816");
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(s.x, s.y, r, 0, Math.PI * 2);
    ctx.fill();

    ctx.shadowBlur = 0;
    ctx.clip();

    ctx.globalAlpha = .16;
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = Math.max(1, 2 * camera.zoom);
    for (let i = -2; i <= 2; i++) {
      ctx.beginPath();
      ctx.ellipse(s.x, s.y + i * r * .22, r * .9, r * (.08 + Math.abs(i) * .015), pl.spin + i * .1, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.globalAlpha = .10;
    for (let i = 0; i < 18; i++) {
      const yy = s.y - r + (i / 17) * r * 2;
      ctx.fillStyle = i % 2 ? "#000" : "#fff";
      ctx.fillRect(s.x - r, yy, r * 2, Math.max(1, r * .028));
    }
    ctx.restore();

    if (pl.rings) {
      ctx.save();
      const count = clamp(Math.round(pl.ringCount || 1), 1, 3);
      const width = Math.max(1, (pl.ringWidth || 3) * camera.zoom);
      for (let i = 0; i < count; i++) {
        const scale = 1.55 + i * .26;
        ctx.strokeStyle = i === 0 ? `${pl.ringColor || "#ffe0a2"}99` : `${pl.ringColor || "#ffe0a2"}55`;
        ctx.lineWidth = Math.max(1, width * (1 - i * .18));
        ctx.beginPath();
        ctx.ellipse(s.x, s.y, r * scale, r * (.36 + i * .055), -0.25, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.restore();
    }

    if (selectedPlanet === pl) {
      ctx.save();
      ctx.strokeStyle = "#7df9ff";
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 6]);
      ctx.beginPath();
      ctx.arc(s.x, s.y, r + 9, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    ctx.fillStyle = "rgba(220,235,255,.78)";
    ctx.font = "11px ui-monospace, monospace";
    ctx.fillText(`${pl.name} M:${Math.round(pl.mass)}`, s.x + r + 9, s.y - r - 7);
  }

  function drawProbe(p) {
    if (p.trail.length > 1) {
      ctx.save();
      ctx.lineWidth = Math.max(1, 1.4 * camera.zoom);
      for (let i = 1; i < p.trail.length; i++) {
        const a = i / p.trail.length;
        const p0 = worldToScreen(p.trail[i - 1].x, p.trail[i - 1].y);
        const p1 = worldToScreen(p.trail[i].x, p.trail[i].y);
        ctx.strokeStyle = `rgba(125,249,255,${a * .55})`;
        ctx.beginPath(); ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y); ctx.stroke();
      }
      ctx.restore();
    }

    const s = worldToScreen(p.x, p.y);
    const r = Math.max(2, p.radius * camera.zoom);
    ctx.save();
    ctx.shadowBlur = 12;
    ctx.shadowColor = "#7df9ff";
    const g = ctx.createRadialGradient(s.x - r * .3, s.y - r * .3, 0, s.x, s.y, r * 1.4);
    g.addColorStop(0, "#ffffff");
    g.addColorStop(.5, "#7df9ff");
    g.addColorStop(1, "#0b4c7d");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(s.x, s.y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawLauncher() {
    const s = worldToScreen(launcher.x, launcher.y);
    const angle = +ui.angle.value * Math.PI / 180;
    const lenBar = 52;
    const ex = s.x + Math.cos(angle) * lenBar;
    const ey = s.y + Math.sin(angle) * lenBar;

    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(angle);

    ctx.shadowBlur = 18;
    ctx.shadowColor = "#ffcc66";
    ctx.fillStyle = "#1b263f";
    ctx.strokeStyle = "#ffcc66";
    ctx.lineWidth = 2;

    ctx.beginPath();
    ctx.roundRect(-18, -11, 42, 22, 7);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = "#ffcc66";
    ctx.fillRect(12, -4, 34, 8);

    ctx.restore();

    ctx.strokeStyle = "rgba(255,204,102,.42)";
    ctx.lineWidth = 2;
    ctx.setLineDash([7, 7]);
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.lineTo(ex + Math.cos(angle) * 60, ey + Math.sin(angle) * 60);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = "#ffe6a3";
    ctx.font = "12px ui-monospace, monospace";
    ctx.fillText("LAUNCHER", s.x + 20, s.y + 31);
  }

  function drawParticles() {
    for (const p of particles) {
      const s = worldToScreen(p.x, p.y);
      ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
      ctx.fillStyle = p.color;
      ctx.fillRect(s.x, s.y, p.size, p.size);
    }
    ctx.globalAlpha = 1;
  }

  function drawModePreview() {
    if (mode === "placePlanet") {
      const r = +ui.planetRadius.value * camera.zoom;
      const a = (+ui.planetRadius.value + +ui.atmosphere.value) * camera.zoom;
      ctx.save();
      ctx.strokeStyle = "rgba(140,255,177,.85)";
      ctx.fillStyle = "rgba(140,255,177,.10)";
      ctx.lineWidth = 2;
      ctx.setLineDash([5,5]);
      ctx.beginPath(); ctx.arc(mouse.x, mouse.y, a, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
      ctx.beginPath(); ctx.arc(mouse.x, mouse.y, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

      ctx.fillStyle = "rgba(235,255,242,.95)";
      ctx.font = "13px ui-monospace, monospace";
      ctx.fillText("點擊放置引力球", mouse.x + 18, mouse.y - 18);
      ctx.restore();
    }
    if (mode === "setLauncher") {
      ctx.save();
      ctx.strokeStyle = "rgba(255,204,102,.95)";
      ctx.fillStyle = "rgba(255,204,102,.12)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(mouse.x, mouse.y, 22, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(mouse.x - 28, mouse.y);
      ctx.lineTo(mouse.x + 28, mouse.y);
      ctx.moveTo(mouse.x, mouse.y - 28);
      ctx.lineTo(mouse.x, mouse.y + 28);
      ctx.stroke();

      ctx.fillStyle = "rgba(255,246,211,.95)";
      ctx.font = "13px ui-monospace, monospace";
      ctx.fillText("點擊放置發射台", mouse.x + 18, mouse.y - 18);
      ctx.restore();
    }
  }

  function renderStatus() {
    const live = probes.filter(p => p.alive).length;
    const selected = selectedPlanet ? `${selectedPlanet.name}｜R ${selectedPlanet.radius}｜M ${Math.round(selectedPlanet.mass)}｜Atm ${selectedPlanet.atmosphere}` : "無";
    ui.status.innerHTML = `
      <div class="chip">模式 <strong>${mode === "placePlanet" ? "等待你點宇宙放引力球" : mode === "setLauncher" ? "等待你點宇宙放發射台" : "一般"}</strong></div>
      <div class="chip">小球 <strong>${live}</strong></div>
      <div class="chip">引力球 <strong>${planets.length}</strong></div>
      <div class="chip">選中 <strong>${selected}</strong></div>
      <div class="chip">空阻 <strong>${(+ui.drag.value).toFixed(3)}</strong></div>
    `;
  }

  let lastTime = performance.now();
  function loop(now) {
    const rawDt = Math.min(0.035, (now - lastTime) / 1000);
    lastTime = now;
    const dt = rawDt * +ui.timeScale.value;

    if (!paused) {
      for (const pl of planets) pl.spin += dt * 0.15;
      const physicsSteps = clamp(Math.ceil(dt * 80), 1, 8);
      const stepDt = dt / physicsSteps;
      for (let step = 0; step < physicsSteps; step++) {
        for (const probe of probes) if (probe.alive) updateProbe(probe, stepDt);
      }
      for (let i = probes.length - 1; i >= 0; i--) if (!probes[i].alive) probes.splice(i, 1);
      updateParticles(dt);
    }

    starField();
    drawLauncher();
    for (const pl of planets) drawPlanet(pl);
    for (const p of probes) drawProbe(p);
    drawParticles();
    drawModePreview();
    renderStatus();

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  function findPlanet(wx, wy) {
    for (let i = planets.length - 1; i >= 0; i--) {
      const p = planets[i];
      if (len(wx - p.x, wy - p.y) <= p.radius + 8 / camera.zoom) return p;
    }
    return null;
  }


  function touchPoint(touch) {
    const rect = canvas.getBoundingClientRect();
    return { x: touch.clientX - rect.left, y: touch.clientY - rect.top };
  }

  function touchCenter(touches) {
    const a = touchPoint(touches[0]);
    if (touches.length === 1) return a;
    const b = touchPoint(touches[1]);
    return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
  }

  function touchDistance(touches) {
    if (touches.length < 2) return 0;
    const a = touchPoint(touches[0]);
    const b = touchPoint(touches[1]);
    return Math.hypot(a.x - b.x, a.y - b.y);
  }

  function updateMouseFromScreen(x, y) {
    mouse.x = x;
    mouse.y = y;
    const w = screenToWorld(x, y);
    mouse.wx = w.x;
    mouse.wy = w.y;
    return w;
  }

  function handlePrimaryTapOrDragStart(x, y) {
    const w = updateMouseFromScreen(x, y);

    if (mode === "setLauncher") {
      launcher.x = w.x;
      launcher.y = w.y;
      explode(w.x, w.y, "#ffcc66", 18);
      finishPlacement();
      return "placed";
    }

    if (mode === "placePlanet") {
      const newPlanet = makePlanet(w.x, w.y, ui.preset.value);
      explode(w.x, w.y, newPlanet.glow || "#7df9ff", 24);
      finishPlacement();
      return "placed";
    }

    const hit = findPlanet(w.x, w.y);
    if (hit) {
      selectedPlanet = hit;
      setPlanetControls(hit);
      draggingPlanet = hit;
      return "dragPlanet";
    }

    selectedPlanet = null;
    return "pan";
  }


  function pointerCenter() {
    const pts = [...pointerState.pointers.values()];
    if (pts.length === 0) return { x: mouse.x, y: mouse.y };
    if (pts.length === 1) return { x: pts[0].x, y: pts[0].y };
    return { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };
  }

  function pointerDistance() {
    const pts = [...pointerState.pointers.values()];
    if (pts.length < 2) return 0;
    return Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
  }

  if (window.PointerEvent) {
    canvas.addEventListener("pointerdown", e => {
      if (e.target !== canvas) return;
      e.preventDefault();
      canvas.setPointerCapture?.(e.pointerId);
      pointerState.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      updateMouseFromScreen(e.clientX, e.clientY);

      if (pointerState.pointers.size >= 2) {
        draggingPlanet = null;
        pointerState.mode = "pinch";
        pointerState.lastCenter = pointerCenter();
        pointerState.lastDist = Math.max(1, pointerDistance());
        return;
      }

      if (e.button === 1 || e.button === 2) {
        panning = true;
        pointerState.mode = "pan";
        pointerState.lastCenter = { x: e.clientX, y: e.clientY };
        return;
      }

      const action = handlePrimaryTapOrDragStart(e.clientX, e.clientY);
      pointerState.mode = action === "dragPlanet" ? "dragPlanet" : action === "placed" ? "placed" : "pan";
      pointerState.lastCenter = { x: e.clientX, y: e.clientY };
    }, { passive: false });

    canvas.addEventListener("pointermove", e => {
      if (!pointerState.pointers.has(e.pointerId)) {
        updateMouseFromScreen(e.clientX, e.clientY);
        return;
      }

      e.preventDefault();
      pointerState.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (pointerState.pointers.size >= 2) {
        const center = pointerCenter();
        const dist = Math.max(1, pointerDistance());

        const before = screenToWorld(center.x, center.y);
        camera.zoom = clamp(camera.zoom * (dist / Math.max(1, pointerState.lastDist)), 0.18, 4.0);
        const after = screenToWorld(center.x, center.y);
        camera.x += before.x - after.x;
        camera.y += before.y - after.y;

        const dx = center.x - pointerState.lastCenter.x;
        const dy = center.y - pointerState.lastCenter.y;
        camera.x -= dx / camera.zoom;
        camera.y -= dy / camera.zoom;

        pointerState.lastCenter = center;
        pointerState.lastDist = dist;
        updateMouseFromScreen(center.x, center.y);
        return;
      }

      const center = pointerCenter();
      const dx = center.x - pointerState.lastCenter.x;
      const dy = center.y - pointerState.lastCenter.y;
      const w = updateMouseFromScreen(center.x, center.y);

      if (draggingPlanet && pointerState.mode === "dragPlanet") {
        draggingPlanet.x = w.x;
        draggingPlanet.y = w.y;
      } else if (pointerState.mode === "pan") {
        camera.x -= dx / camera.zoom;
        camera.y -= dy / camera.zoom;
      }

      pointerState.lastCenter = center;
    }, { passive: false });

    function endPointer(e) {
      pointerState.pointers.delete(e.pointerId);
      if (pointerState.pointers.size === 0) {
        draggingPlanet = null;
        panning = false;
        pointerState.mode = "none";
      } else if (pointerState.pointers.size === 1) {
        const c = pointerCenter();
        pointerState.lastCenter = c;
        pointerState.mode = "pan";
      }
    }

    canvas.addEventListener("pointerup", endPointer, { passive: false });
    canvas.addEventListener("pointercancel", endPointer, { passive: false });
  }

  canvas.addEventListener("contextmenu", e => e.preventDefault());

  canvas.addEventListener("mousedown", e => {
    if (pointerState.usingPointer) return;
    lastMouse = { x: e.clientX, y: e.clientY };

    if (e.button === 1 || e.button === 2) {
      panning = true;
      return;
    }

    const action = handlePrimaryTapOrDragStart(e.clientX, e.clientY);
    if (action === "pan") {
      // 滑鼠左鍵點空白處只取消選取，不直接平移；右鍵/中鍵才平移。
      panning = false;
    }
  });

  canvas.addEventListener("mousemove", e => {
    if (pointerState.usingPointer) return;
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    const w = screenToWorld(e.clientX, e.clientY);
    mouse.wx = w.x;
    mouse.wy = w.y;

    if (panning) {
      const dx = e.clientX - lastMouse.x;
      const dy = e.clientY - lastMouse.y;
      camera.x -= dx / camera.zoom;
      camera.y -= dy / camera.zoom;
      lastMouse = { x: e.clientX, y: e.clientY };
    }

    if (draggingPlanet) {
      draggingPlanet.x = w.x;
      draggingPlanet.y = w.y;
    }
  });

  addEventListener("mouseup", () => {
    if (pointerState.usingPointer) return;
    draggingPlanet = null;
    panning = false;
  });

  canvas.addEventListener("wheel", e => {
    e.preventDefault();
    const before = screenToWorld(e.clientX, e.clientY);
    const factor = Math.exp(-e.deltaY * 0.001);
    camera.zoom = clamp(camera.zoom * factor, 0.18, 4.0);
    const after = screenToWorld(e.clientX, e.clientY);
    camera.x += before.x - after.x;
    camera.y += before.y - after.y;
  }, { passive: false });

  canvas.addEventListener("touchstart", e => {
    if (pointerState.usingPointer) return;
    e.preventDefault();
    touchState.active = true;
    touchState.moved = false;
    touchState.startTime = performance.now();

    if (e.touches.length === 1) {
      const p = touchPoint(e.touches[0]);
      touchState.lastX = p.x;
      touchState.lastY = p.y;
      const action = handlePrimaryTapOrDragStart(p.x, p.y);
      touchState.mode = action === "dragPlanet" ? "dragPlanet" : action === "placed" ? "placed" : "pan";
    } else if (e.touches.length >= 2) {
      draggingPlanet = null;
      touchState.mode = "pinch";
      touchState.lastDist = touchDistance(e.touches);
      touchState.lastCenter = touchCenter(e.touches);
      updateMouseFromScreen(touchState.lastCenter.x, touchState.lastCenter.y);
    }
  }, { passive: false });

  canvas.addEventListener("touchmove", e => {
    if (pointerState.usingPointer) return;
    e.preventDefault();

    if (e.touches.length >= 2) {
      const center = touchCenter(e.touches);
      const dist = Math.max(1, touchDistance(e.touches));

      const before = screenToWorld(center.x, center.y);
      const factor = dist / Math.max(1, touchState.lastDist);
      camera.zoom = clamp(camera.zoom * factor, 0.18, 4.0);
      const after = screenToWorld(center.x, center.y);
      camera.x += before.x - after.x;
      camera.y += before.y - after.y;

      const dx = center.x - touchState.lastCenter.x;
      const dy = center.y - touchState.lastCenter.y;
      camera.x -= dx / camera.zoom;
      camera.y -= dy / camera.zoom;

      touchState.lastDist = dist;
      touchState.lastCenter = center;
      touchState.moved = true;
      updateMouseFromScreen(center.x, center.y);
      return;
    }

    if (e.touches.length === 1) {
      const p = touchPoint(e.touches[0]);
      const dx = p.x - touchState.lastX;
      const dy = p.y - touchState.lastY;
      if (Math.hypot(dx, dy) > 3) touchState.moved = true;

      const w = updateMouseFromScreen(p.x, p.y);

      if (draggingPlanet && touchState.mode === "dragPlanet") {
        draggingPlanet.x = w.x;
        draggingPlanet.y = w.y;
      } else if (touchState.mode === "pan") {
        camera.x -= dx / camera.zoom;
        camera.y -= dy / camera.zoom;
      }

      touchState.lastX = p.x;
      touchState.lastY = p.y;
    }
  }, { passive: false });

  canvas.addEventListener("touchend", e => {
    if (pointerState.usingPointer) return;
    e.preventDefault();

    if (e.touches.length === 0) {
      draggingPlanet = null;
      touchState.active = false;
      touchState.mode = "none";
      return;
    }

    if (e.touches.length === 1) {
      const p = touchPoint(e.touches[0]);
      touchState.lastX = p.x;
      touchState.lastY = p.y;
      touchState.mode = "pan";
      touchState.lastCenter = p;
      updateMouseFromScreen(p.x, p.y);
    }
  }, { passive: false });

  canvas.addEventListener("touchcancel", e => {
    if (pointerState.usingPointer) return;
    e.preventDefault();
    draggingPlanet = null;
    touchState.active = false;
    touchState.mode = "none";
  }, { passive: false });


  let panelOpen = false;

  function setPanelOpen(open) {
    panelOpen = open;
    ui.controlPanel.classList.toggle("open", panelOpen);
    ui.panelToggle.classList.toggle("panel-open", panelOpen);
    ui.panelToggle.textContent = panelOpen ? "關閉面板 ▼" : "控制面板 ▲";
  }

  ui.panelToggle.onclick = () => setPanelOpen(!panelOpen);
  setPanelOpen(false);

  ui.launchBtn.onclick = launchProbe;
  ui.setLauncherBtn.onclick = () => setMode("setLauncher");
  ui.placePlanetBtn.onclick = () => setMode("placePlanet");
  ui.clearProbesBtn.onclick = () => { probes.length = 0; particles.length = 0; };
  ui.pauseBtn.onclick = () => {
    paused = !paused;
    ui.pauseBtn.textContent = paused ? "繼續" : "暫停";
  };

  ui.orbitModeBtn.onclick = () => {
    orbitAssistMode = !orbitAssistMode;
    ui.orbitModeBtn.textContent = orbitAssistMode ? "軌道模式：開" : "軌道模式：關";
    ui.orbitModeBtn.classList.toggle("orbit-active", orbitAssistMode);
  };
  ui.resetViewBtn.onclick = () => { camera.x = 0; camera.y = 0; camera.zoom = 1; };
  ui.deletePlanetBtn.onclick = () => {
    if (!selectedPlanet) return;
    const i = planets.indexOf(selectedPlanet);
    if (i >= 0) planets.splice(i, 1);
    selectedPlanet = null;
  };
  ui.clearAllBtn.onclick = () => {
    planets.length = 0;
    probes.length = 0;
    particles.length = 0;
    selectedPlanet = null;
    setMode("none");
  };



  ui.preset.addEventListener("change", applyPresetToSliders);

  function bindRangeNumber(rangeId, numId) {
    const range = ui[rangeId];
    const num = ui[numId];
    if (!range || !num) return;

    range.addEventListener("input", () => {
      num.value = rangeId === "drag" ? (+range.value).toFixed(3) : rangeId === "timeScale" ? (+range.value).toFixed(2) : range.value;

      if (["planetRadius", "planetMass", "atmosphere"].includes(rangeId) && selectedPlanet) {
        selectedPlanet.radius = +ui.planetRadius.value;
        selectedPlanet.mass = +ui.planetMass.value;
        selectedPlanet.atmosphere = +ui.atmosphere.value;
      }
    });

    num.addEventListener("change", () => {
      let v = +num.value;
      const lo = +range.min;
      const hi = +range.max;
      if (Number.isNaN(v)) v = +range.value;
      v = clamp(v, lo, hi);
      range.value = v;
      num.value = rangeId === "drag" ? v.toFixed(3) : rangeId === "timeScale" ? v.toFixed(2) : Math.round(v * 1000) / 1000;
      range.dispatchEvent(new Event("input"));
    });
  }

  bindRangeNumber("power", "powerNum");
  bindRangeNumber("angle", "angleNum");
  bindRangeNumber("probeRadius", "probeRadiusNum");
  bindRangeNumber("drag", "dragNum");
  bindRangeNumber("timeScale", "timeScaleNum");
  bindRangeNumber("trail", "trailNum");
  bindRangeNumber("planetRadius", "planetRadiusNum");
  bindRangeNumber("planetMass", "planetMassNum");
  bindRangeNumber("atmosphere", "atmosphereNum");

  const colorInputs = ["primaryColor", "secondaryColor"];
  colorInputs.forEach(id => {
    if (!ui[id]) return;
    ui[id].addEventListener("input", () => {
      if (selectedPlanet) {
        selectedPlanet.colors = [ui.primaryColor.value, ui.secondaryColor.value];
        selectedPlanet.glow = ui.secondaryColor.value;
      }
    });
  });

  addEventListener("keydown", e => {
    if (e.code === "Space") { e.preventDefault(); launchProbe(); }
    if (e.key.toLowerCase() === "p") ui.placePlanetBtn.click();
    if (e.key.toLowerCase() === "l") ui.setLauncherBtn.click();
    if (e.key.toLowerCase() === "r") ui.resetViewBtn.click();
    if (e.key.toLowerCase() === "o") ui.orbitModeBtn.click();
    if (e.key === "Delete" || e.key === "Backspace") ui.deletePlanetBtn.click();
  });

  // 初始場景
  ui.preset.value = "earth"; applyPresetToSliders();
  makePlanet(0, 0, "earth");
  ui.preset.value = "moon"; applyPresetToSliders();
  makePlanet(310, -120, "moon");
  selectedPlanet = planets[0];
  setPlanetControls(selectedPlanet);
  syncLabels();

  // Canvas roundRect fallback
  if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
      if (w < 2 * r) r = w / 2;
      if (h < 2 * r) r = h / 2;
      this.beginPath();
      this.moveTo(x + r, y);
      this.arcTo(x + w, y, x + w, y + h, r);
      this.arcTo(x + w, y + h, x, y + h, r);
      this.arcTo(x, y + h, x, y, r);
      this.arcTo(x, y, x + w, y, r);
      this.closePath();
      return this;
    };
  }
})();
</script>
</body>
